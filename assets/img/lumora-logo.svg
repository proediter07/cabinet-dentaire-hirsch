  <!-- Typography Right -->
  <text x="54" y="23" fill="#ffffff" filter="url(#footTextShadow)" font-family="'Plus Jakarta Sans', Sora, -apple-system, sans-serif" font-size="17" font-weight="800" letter-spacing="-0.3">Dr. Shandy Hirsch</text>
  <text x="54" y="37" fill="#f472b6" font-family="'Plus Jakarta Sans', Sora, -apple-system, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.8" text-transform="uppercase">Cabinet Dentaire • Luxembourg</text>
</svg>