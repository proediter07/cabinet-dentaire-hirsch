<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="hirschPulpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be185d" />
      <stop offset="50%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="hirschCircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#9d174d" />
    </linearGradient>
    <radialGradient id="hirschGlassBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#08333a" />
      <stop offset="100%" stop-color="#011f23" />
    </radialGradient>
    <filter id="hirschPulpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#f43f5e" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Outer Circular Jewel Seal -->
  <circle cx="50" cy="50" r="47" fill="url(#hirschGlassBg)" stroke="url(#hirschCircleGrad)" stroke-width="2.2" />

  <!-- Subtle Gingival Gum Contour Line -->
  <path d="M 3 53 C 18 53, 21 40, 29 48" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.6" stroke-linecap="round" />
  <path d="M 97 53 C 82 53, 79 40, 71 48" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.6" stroke-linecap="round" />

  <!-- Outer Molar Silhouette (Enamel Crown & Dual Roots) -->
  <path d="M 26 24 C 36 21, 46 27, 50 25 C 54 27, 64 21, 74 24 C 77 34, 75 44, 71 52 C 67 62, 69 76, 68 85 C 67 89, 61 90, 58 87 C 55 83, 56 68, 54 58 C 52 50, 48 50, 46 58 C 44 68, 45 83, 42 87 C 39 90, 33 89, 32 85 C 31 76, 33 62, 29 52 C 25 44, 23 34, 26 24 Z" 
        fill="rgba(255, 255, 255, 0.08)" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round" />

  <!-- Occlusal Cusp Line (Enamel Cap Layer) -->
  <path d="M 27 27 C 38 31, 46 29, 50 33 C 54 29, 62 31, 73 27" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.4" stroke-linecap="round" />

  <!-- Dentin Boundary (Subtle Rose Translucent Tint) -->
  <path d="M 32 34 C 40 33, 46 36, 50 35 C 54 36, 60 33, 68 34 C 69 44, 66 54, 63 64 C 61 72, 63 80, 61 83 C 60 84, 58 83, 57 80 C 54 72, 54 60, 52 54 C 51 48, 49 48, 48 54 C 46 60, 46 72, 43 80 C 42 83, 40 84, 39 83 C 37 80, 39 72, 37 64 C 34 54, 31 44, 32 34 Z" 
        fill="rgba(244, 114, 182, 0.08)" stroke="rgba(244, 114, 182, 0.45)" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Inner Pulp Chamber & Root Canals (The Radiant Jewel Core) -->
  <path d="M 38 40 C 44 38, 48 40, 50 39 C 52 40, 56 38, 62 40 C 63 46, 60 52, 58 60 C 56 68, 58 76, 56 78 C 55 78, 54 77, 54 74 C 53 66, 52 54, 50 51 C 48 54, 47 66, 46 74 C 46 77, 45 78, 44 78 C 42 76, 44 68, 42 60 C 40 52, 37 46, 38 40 Z" 
        fill="url(#hirschPulpGrad)" filter="url(#hirschPulpGlow)" />
</svg>